name: privacy-gate

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    environment: privacy-gate
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build engine
        run: cargo build --release --locked
        working-directory: core/rust
      - name: Scan
        env:
          HARNESS_PRIVACY_LIST_SECRET: ${{ secrets.PRIVACY_LIST }}
        run: |
          rc=0
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git update-ref refs/gate/base HEAD^1
            git checkout --detach HEAD^2
            sh ci/privacy-gate.sh --tree || rc=1
            sh ci/privacy-gate.sh --range HEAD ^refs/gate/base || rc=1
          else
            sh ci/privacy-gate.sh || rc=1
          fi
          exit "$rc"
