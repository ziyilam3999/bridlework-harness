name: rust-test

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build and test
        run: sh ci/rust-test.sh
      - name: Clippy
        run: sh ci/rust-clippy.sh
      - name: Release smoke
        run: sh ci/release-smoke.sh all
      - name: MCP tools lint
        run: sh ci/mcp-tools-lint.sh --build
      - name: MCP tools lint self-test
        run: sh ci/mcp-tools-lint.sh --build --self-test
